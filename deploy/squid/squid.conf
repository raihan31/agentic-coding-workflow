# Egress proxy for the agent sandbox network: HTTPS CONNECT to allowlisted domains only.
http_port 3128

acl allowlist dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access deny !allowlist
http_access allow allowlist
http_access deny all

cache deny all
# Egress audit log: docker exec agentic-egress tail -f /var/log/squid/access.log
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename none
shutdown_lifetime 1 seconds
