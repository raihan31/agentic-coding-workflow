{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels: {{- include "agentic.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }   # project history outlives the release
spec:
  accessModes: {{ toJson .Values.persistence.accessModes }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
{{- end }}
