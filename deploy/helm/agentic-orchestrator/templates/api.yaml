apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "agentic.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: {{- include "agentic.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- range . }}
        - name: {{ . }}{{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Listening on the pod network: the CLI refuses to start without AGENTIC_API_TOKEN.
          args: [api, --host, 0.0.0.0, --port, "8787", --runs-dir, "{{ .Values.persistence.mountPath }}/runs", --config, /etc/agentic/config.json]
          env:
            {{- include "agentic.env" . | nindent 12 }}
            - { name: AGENTIC_REPO_ROOTS, value: "{{ .Values.persistence.mountPath }}/repos" }
          ports: [{ name: http, containerPort: 8787 }]
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 30, failureThreshold: 5 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "agentic.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- include "agentic.volumeMounts" . | nindent 12 }}
      volumes: {{- include "agentic.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "agentic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.api.service.port }}, targetPort: http }]
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "agentic.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
{{- end }}
