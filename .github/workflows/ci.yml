name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      # Store and API tests run against a real Postgres (they skip when it is unreachable).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentic" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Lets the real-container gitleaks test run (the semgrep one skips without its larger image).
      - run: docker pull -q zricethezav/gitleaks:v8.30.1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run ui:build
      - run: npm test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/agentic-orchestrator
      - run: helm template ci deploy/helm/agentic-orchestrator --set api.ingress.enabled=true > /tmp/rendered.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The chart's generated workflow config must pass the orchestrator's own schema.
      - name: Validate rendered config
        run: |
          python3 - <<'PY'
          import re
          y = open('/tmp/rendered.yaml').read()
          m = re.search(r'config.json: \|\n((?:    .*\n)+)', y)
          open('/tmp/config.json', 'w').write('\n'.join(l[4:] for l in m.group(1).splitlines()))
          PY
          npx tsx -e "import('./src/config.ts').then(m => m.loadConfig('/tmp/config.json')).then(c => console.log('ok', c.agentRuntime.type))"
